name: Validate pilot viewer

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/validate-pages.yml"
      - ".github/workflows/deploy-pages.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify pilot data exists
        run: test -f docs/data/qualitative-capture.json

      - name: Verify viewer files exist
        run: |
          test -f docs/index.html
          test -f docs/app.js
          test -f docs/styles.css

      - name: Validate pilot JSON structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("docs/data/qualitative-capture.json").read_text())
          assert data.get("schoolCount", 0) > 0, "schoolCount must be > 0"
          assert data.get("records"), "records must be non-empty"
          for record in data["records"]:
              assert record.get("urn") and record.get("name")
              assert record.get("areas"), f"missing areas for {record['urn']}"
          print(f"OK: {data['schoolCount']} school(s)")
          PY
